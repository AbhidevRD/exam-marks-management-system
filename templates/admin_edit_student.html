{% extends "base_admin.html" %}

{% block title %}Edit Student - Admin Dashboard{% endblock %}
{% block page_title %}✏️ Edit Student Details{% endblock %}

{% block content %}
<div class="panel" style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Details for {{ student.name }}</h2>
    <form method="POST" class="admin-form">
        <div class="form-grid-2">
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" name="name" value="{{ student.name }}" placeholder="Enter student name" required>
            </div>
            <div class="form-group">
                <label>Class</label>
                <input type="text" name="class" value="{{ student.class }}" placeholder="e.g., 10A" required>
            </div>
        </div>
        <div class="form-grid-2">
            <div class="form-group">
                <label>Section</label>
                <input type="text" name="section" value="{{ student.section }}" placeholder="e.g., A" required>
            </div>
            <div class="form-group">
                <label>Login Unique ID</label>
                <input type="text" name="unique_id" value="{{ user.unique_id if user else '' }}" placeholder="Enter unique ID" required>
            </div>
        </div>
        <div class="form-group">
            <label>Update Password (leave blank to keep current)</label>
            <input type="password" name="password" placeholder="Enter new password (optional)">
        </div>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="submit" class="btn-primary" style="flex: 1;">Save Changes</button>
            <a href="/admin/students" style="flex: 1; text-align: center; text-decoration: none; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
