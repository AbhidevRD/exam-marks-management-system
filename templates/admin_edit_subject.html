{% extends "base_admin.html" %}

{% block title %}Edit Subject - Admin Dashboard{% endblock %}
{% block page_title %}📚 Edit Subject{% endblock %}

{% block content %}
<div class="panel" style="max-width: 500px; margin: 0 auto;">
    <h2>Edit Details for {{ subject.subject_name }}</h2>
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label>Subject Name</label>
            <input type="text" name="subject_name" value="{{ subject.subject_name }}" placeholder="Enter subject name" required>
        </div>
        <div class="form-group">
            <label>Maximum Marks</label>
            <input type="number" name="max_marks" value="{{ subject.max_marks }}" placeholder="e.g., 100" min="1" required>
        </div>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="submit" class="btn-primary" style="flex: 1;">Save Changes</button>
            <a href="/admin/subjects" style="flex: 1; text-align: center; text-decoration: none; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
