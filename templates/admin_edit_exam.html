{% extends "base_admin.html" %}

{% block title %}Edit Exam - Admin Dashboard{% endblock %}
{% block page_title %}📝 Edit Exam{% endblock %}

{% block content %}
<div class="panel" style="max-width: 500px; margin: 0 auto;">
    <h2>Edit Details for {{ exam.exam_name }}</h2>
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label>Exam Name</label>
            <input type="text" name="exam_name" value="{{ exam.exam_name }}" placeholder="e.g., Midterm 2026" required>
        </div>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="submit" class="btn-primary" style="flex: 1;">Save Changes</button>
            <a href="/admin/exams" style="flex: 1; text-align: center; text-decoration: none; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
